version: "1.0"
pack_name: "Nexus Crucible"
minecraft_version: "1.12.2"
forge_version: "14.23.5.2860"

categories:
  tech: "Технологии, энергетика, переработка и автоматизация"
  magic: "Магия, алхимия, астрономия и ритуалы"
  world: "Генерация мира, биомы, структуры и существа"
